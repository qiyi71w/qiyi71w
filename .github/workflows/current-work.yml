name: Update Current Work

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "profile.json"
      - "scripts/generate_current_work.py"
      - ".github/workflows/current-work.yml"

permissions:
  contents: write

concurrency:
  group: profile-write
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate and publish Current Work SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}/3"

            # Always render from the latest main so a user push that lands while
            # this workflow is running cannot leave us with a stale commit base.
            git fetch origin main
            git reset --hard origin/main

            python scripts/generate_current_work.py
            git add assets/current-work.svg

            if git diff --cached --quiet; then
              echo "Current Work SVG is already up to date."
              exit 0
            fi

            git commit -m "chore: update current work card"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "main advanced while publishing; regenerating from latest main..."
          done

          echo "Failed to publish Current Work SVG after 3 attempts."
          exit 1
