name: Update Current Work

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "profile.json"
      - "scripts/generate_current_work.py"
      - ".github/workflows/current-work.yml"

permissions:
  contents: write

concurrency:
  group: profile-write
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate Current Work SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_current_work.py
      - name: Commit SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/current-work.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update current work card"
          git push
